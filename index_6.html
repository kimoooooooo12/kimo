<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --sky:#2F8FD8;        /* ciel */
  --sky-deep:#1B6FB0;
  --sky-pale:#E4F2FC;
  --sand:#F0D28A;       /* sable de la plage */
  --sand-pale:#FAF1D8;
  --sand-deep:#C9A24A;
  --ink:#12304A;
  --line:#D4E3EE;
  --radius:8px;
  --display:"Cormorant Garamond","Amiri",Georgia,serif;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{font-family:"Cairo",system-ui,Arial,sans-serif;color:var(--ink);background:#fff;line-height:1.65;font-size:17px}
a{color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid var(--sky-deep);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.1}

/* header */
header{background:var(--sky-deep);color:#fff;position:sticky;top:0;z-index:5}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:8px;padding-bottom:8px}
.logo{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:1.4rem;text-decoration:none}
.kimo-face{width:42px;height:42px;flex:none;border-radius:50%;border:2px solid #fff;background:var(--sand) var(--kimo) 50% 0/125% auto no-repeat}
nav{display:flex;gap:16px;align-items:center;font-size:.95rem}
nav a{text-decoration:none;opacity:.92}
nav a:hover{opacity:1}
.lang button{background:none;border:1px solid #ffffff88;color:#fff;border-radius:6px;padding:2px 8px;font:inherit;font-size:.85rem;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--sand);border-color:var(--sand);color:var(--ink);font-weight:800}
.lang{display:flex;gap:4px;flex-wrap:nowrap}
@media(max-width:700px){nav a.hide-sm{display:none}nav{gap:8px}.logo{font-size:1.05rem;white-space:nowrap;gap:8px}.kimo-face{width:36px;height:36px}.lang button{padding:2px 6px}}

/* hero: the Carthage photo fills the whole section, white sky on top */
.hero{position:relative;overflow:hidden;min-height:580px;display:flex;align-items:center;background:var(--sky) var(--photo) 50% 12%/cover no-repeat}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.75) 0%,rgba(255,255,255,.2) 38%,rgba(255,255,255,0) 60%)}
.hero .wrap{position:relative;z-index:2;width:100%;display:flex;justify-content:flex-end;padding-top:48px;padding-bottom:48px}
.hero-card{width:min(100%,470px);background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:14px;padding:24px 26px;box-shadow:0 14px 40px rgba(10,42,68,.35)}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.kimo-logo{width:92px;aspect-ratio:520/703;flex:none;background:var(--kimo) center/contain no-repeat}
.hero h1{font-size:clamp(2.6rem,8vw,4.4rem);font-weight:700;color:var(--ink)}
.hero .sub{font-family:var(--display);font-size:1.6rem;color:var(--sky-deep);margin:4px 0 8px}
.hero p.lead{margin-bottom:20px;font-size:1.1rem}
.btn{display:inline-block;background:var(--sand);color:var(--ink);font:inherit;font-weight:800;text-decoration:none;border:2px solid var(--sand-deep);border-radius:var(--radius);padding:10px 22px;cursor:pointer}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--sky-deep);border-color:var(--sky-deep);margin-inline-start:10px}
@media(max-width:700px){.hero{min-height:660px;align-items:flex-end}.hero .wrap{justify-content:center;padding-top:210px;padding-bottom:28px}}

section{padding:60px 0}
h2{font-size:2.3rem;font-weight:700;margin-bottom:6px;color:var(--sky-deep)}
.intro{margin-bottom:24px;max-width:52ch;opacity:.88}

/* services */
#services{background:var(--sky-pale)}
.prices{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));max-width:860px}
.price-card{background:#fff;border-top:5px solid var(--sand-deep);padding:20px;border-radius:var(--radius)}
.price-card h3{font-size:1.5rem;margin-bottom:4px}
.price-card .p{font-family:var(--display);font-size:2.6rem;font-weight:700;color:var(--sky-deep);line-height:1}
.place-note{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:.92rem;font-weight:600}

/* booking */
#book{background:#fff}
form{display:grid;gap:14px;max-width:520px}
label,fieldset{display:grid;gap:4px;font-weight:600;font-size:.95rem}
fieldset{border:0;padding:0}
legend{font-weight:600;margin-bottom:6px}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:#F5FAFE;color:var(--ink)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice label{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:var(--radius);padding:10px 12px;cursor:pointer;background:#F5FAFE}
.choice label:has(input:checked){border-color:var(--sky-deep);background:var(--sky-pale)}
.choice input{accent-color:var(--sky-deep)}
.hint{font-size:.88rem;opacity:.75}

.msg{font-weight:600;min-height:1.4em}
.msg .btn{margin-inline-start:8px;padding:6px 14px}

/* Carthage: beach sand */
#carthage{background:var(--sand);color:var(--ink)}
#carthage h2{color:var(--ink)}
.places{display:grid;gap:0;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));border-top:1px solid rgba(18,48,74,.3)}
.place{padding:22px 18px 22px 0;border-bottom:1px solid rgba(18,48,74,.3)}
[dir="rtl"] .place{padding:22px 0 22px 18px}
.place h3{font-size:1.6rem;margin-bottom:4px}
.place p{font-size:.98rem}

/* products */
#shop{background:#fff}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.product{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:8px;align-content:start}
.product .img{aspect-ratio:4/3;background:linear-gradient(135deg,var(--sand-pale),var(--sky-pale));border-radius:6px;display:grid;place-items:center;font-size:.85rem;opacity:.8}
.product .price{font-weight:800;color:var(--sky-deep)}

.pbody{display:grid;gap:8px;align-content:start}
.pname{font-weight:800}
.desc{opacity:.85;font-size:.98rem}
.product .img.photo{aspect-ratio:2/3;background-color:#fff;background-size:contain;background-position:center;background-repeat:no-repeat;border:1px solid var(--line)}
.featured{grid-column:1/-1;grid-template-columns:minmax(180px,280px) 1fr;gap:26px;align-items:center}
.featured .pname{font-family:var(--display);font-size:2.2rem;line-height:1.05}
.featured .price{font-family:var(--display);font-size:2.6rem;font-weight:700;line-height:1}
.featured .btn{justify-self:start}
.chip.new{background:var(--sand);border-color:var(--sand-deep);justify-self:start}
.swatches{display:flex;align-items:center;gap:8px;font-weight:600}
.sw{width:32px;height:32px;padding:0;border-radius:50%;background:var(--c);border:2px solid #fff;box-shadow:0 0 0 1px #9fb6c8;cursor:pointer}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--sky-deep)}
@media(max-width:640px){.featured{grid-template-columns:1fr}.featured .img{max-width:300px;width:100%;margin-inline:auto}}

/* reviews */
#reviews{background:var(--sky-pale)}
.reviews{display:grid;gap:14px;max-width:640px;margin-bottom:34px}
.review{background:#fff;border-inline-start:4px solid var(--sand-deep);padding:12px 16px;border-radius:0 var(--radius) var(--radius) 0}
[dir="rtl"] .review{border-radius:var(--radius) 0 0 var(--radius)}
.stars{color:var(--sand-deep);letter-spacing:2px}

/* location */
#location{background:var(--sand-pale)}
.loc{display:grid;gap:22px;grid-template-columns:1fr 1.5fr}
@media(max-width:700px){.loc{grid-template-columns:1fr}}
iframe{width:100%;height:320px;border:0;border-radius:var(--radius)}

footer{background:var(--ink);color:#fff;text-align:center;padding:24px;font-size:.9rem}
.wa-float{position:fixed;inset-block-end:18px;inset-inline-end:18px;background:#25D366;color:#fff;font-weight:800;text-decoration:none;border-radius:999px;padding:12px 18px;box-shadow:0 4px 14px #0003;z-index:6}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

let lang = localStorage.getItem("lang") || "fr";
const $ = s => document.querySelector(s);
const wa = text => `https://wa.me/${SHOP.whatsapp}?text=${encodeURIComponent(text)}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tkey = {fr:"tf",ar:"ta",en:"te"};

function render(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = T[lang][el.dataset.i18n]);
  document.querySelectorAll("[data-brand]").forEach(el => el.textContent = SHOP.name);
  document.querySelectorAll("[data-brand-short]").forEach(el => el.textContent = SHOP.shortName);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));

  $("#serviceList").innerHTML = SERVICES.map(s => `<div class="price-card"><h3>${esc(s[lang])}</h3><div class="p">${s.price} ${SHOP.currency}</div></div>`).join("")
    + `<div class="price-card"><h3>${T[lang].place_home}</h3><div class="p">${SHOP.homePrice} ${SHOP.currency}</div><p class="hint">${T[lang].home_line}</p></div>`;
  renderServiceOptions();

  $("#placeList").innerHTML = PLACES.map(p => `<div class="place"><h3>${esc(p[lang])}</h3><p>${esc(p[tkey[lang]])}</p></div>`).join("");

  renderProducts();

  $("#reviewList").innerHTML = REVIEWS.map(r => `
    <div class="review"><div class="stars">${"★".repeat(r.rating)}${"☆".repeat(5 - r.rating)}</div>
    <p>${esc(r.text)}</p><small>${esc(r.name)}</small></div>`).join("");

  $("#address").textContent = SHOP.address;
  $("#phoneLink").textContent = SHOP.phoneDisplay;
  $("#phoneLink").href = "tel:+" + SHOP.whatsapp;
  $("#waFloat").href = wa("");
  $("#mapLink").href = SHOP.mapsLink;
  $("#map").src = "https://maps.google.com/maps?q=" + encodeURIComponent(SHOP.mapQuery) + "&output=embed";
  renderNote();
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; localStorage.setItem("lang", lang); render();
}));

// ---- time slots = opening hours minus prayer pauses ----
const toMin = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
const fmt = n => String(Math.floor(n / 60)).padStart(2, "0") + ":" + String(n % 60).padStart(2, "0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const prayerCache = {};
let note = { state: "", prayers: [] };

// free Aladhan API, Tunisian Ministry of Religious Affairs method (18), no key needed
async function getPrayers(date){
  if (prayerCache[date]) return prayerCache[date];
  const [y, m, d] = date.split("-");
  const url = `https://api.aladhan.com/v1/timings/${d}-${m}-${y}?latitude=${COORDS.lat}&longitude=${COORDS.lon}&method=18`;
  const res = await fetch(url);
  const t = (await res.json()).data.timings;
  const list = ["Dhuhr", "Asr", "Maghrib", "Isha"].map((k, i) => ({ i, start: toMin(t[k].slice(0, 5)) }));
  prayerCache[date] = list;
  return list;
}

function renderNote(){
  const t = T[lang], el = $("#pauseNote");
  if (note.state === "closed") el.textContent = t.n_closed;
  else if (note.state === "none") el.textContent = t.n_none;
  else if (note.state === "offline") el.textContent = t.n_offline;
  else if (note.state === "ok" && note.prayers.length)
    el.textContent = t.n_pause + note.prayers.map(p => `${t.pr[p.i]} ${fmt(p.start)}`).join(", ");
  else el.textContent = "";
}

async function buildSlots(){
  const date = $("#dateInput").value, sel = $("#timeSelect");
  const empty = '<option value="">–</option>';
  let pauses = [], taken = new Set();
  note = { state: "", prayers: [] };
  if (date) {
    if (CLOSED_DAYS.includes(new Date(date + "T12:00:00").getDay())) {
      sel.innerHTML = empty; note.state = "closed"; return renderNote();
    }
    try { pauses = await getPrayers(date); note.state = "ok"; }
    catch (err) { note.state = "offline"; }
    if (SUPABASE.url) { try { taken = await getTaken(date); } catch (err) { /* the booking itself will say if the database is down */ } }
    if (date !== $("#dateInput").value) return;      // the date changed while loading
  }
  const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes(), isToday = date === todayStr();
  const slots = [];
  for (let s = HOURS.open * 60; s + SLOT_MINUTES <= HOURS.close * 60; s += SLOT_MINUTES) {
    if (isToday && s <= nowMin) continue;
    const blocked = pauses.some(p => s < p.start + PRAYER_PAUSE_MINUTES && s + SLOT_MINUTES > p.start);
    if (!blocked && !taken.has(fmt(s))) slots.push(fmt(s));
  }
  note.prayers = pauses.filter(p => p.start < HOURS.close * 60 && p.start + PRAYER_PAUSE_MINUTES > HOURS.open * 60);
  if (!slots.length) note.state = "none";
  sel.innerHTML = slots.length ? slots.map(x => `<option>${x}</option>`).join("") : empty;
  renderNote();
}

$("#dateInput").addEventListener("change", buildSlots);
$("#dateInput").min = todayStr();
$("#dateInput").value = todayStr();
buildSlots();

// in shop / at home
document.querySelectorAll('input[name="place"]').forEach(r => r.addEventListener("change", () => {
  const home = document.querySelector('input[name="place"]:checked').value === "home";
  $("#addrBox").hidden = !home;
  $("#addrInput").required = home;
  renderServiceOptions();
}));

// booking: save it in the database first (the database refuses a second booking of the same day + time), then WhatsApp
$("#bookForm").addEventListener("submit", async e => {
  e.preventDefault();
  const f = new FormData(e.target), t = T[lang], out = $("#bookMsg"), home = f.get("place") === "home";
  const where = home ? t.m_home + f.get("addr") : t.m_store;
  const link = wa(`${t.m_book}${f.get("service")} | ${f.get("date")} ${f.get("time")} | ${where} | ${f.get("name")} | ${f.get("phone")}`);
  if (!SUPABASE.url) { window.open(link, "_blank", "noopener"); return; }
  out.textContent = "…";
  try {
    const r = await fetch(`${SUPABASE.url}/rest/v1/bookings`, {
      method: "POST",
      headers: { apikey: SUPABASE.anonKey, Authorization: "Bearer " + SUPABASE.anonKey, "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify({ day: f.get("date"), slot: f.get("time"), name: f.get("name"), phone: f.get("phone"),
        service: f.get("service"), place: home ? "home" : "store", address: home ? f.get("addr") : null })
    });
    if (r.status === 409) { out.textContent = t.b_taken; buildSlots(); return; }   // someone was faster
    if (!r.ok) throw new Error(r.status);
  } catch (err) { out.textContent = t.b_error; return; }
  out.innerHTML = `${esc(t.b_ok)} <a class="btn" target="_blank" rel="noopener" href="${link}">WhatsApp</a>`;
  buildSlots();   // the slot disappears from the list right away
  setTimeout(() => { location.href = link; }, 800);   // then straight to WhatsApp, message ready to send
});

// review -> WhatsApp to the owner (he approves, then adds it to REVIEWS)
$("#reviewForm").addEventListener("submit", e => {
  e.preventDefault();
  const f = new FormData(e.target);
  window.open(wa(`${T[lang].m_rev}${f.get("rating")}/5 | ${f.get("name")} | ${f.get("comment")}`), "_blank", "noopener");
  e.target.reset();
});

// ---- appointments already taken on a day (from the database) ----
async function getTaken(date){
  const r = await fetch(`${SUPABASE.url}/rest/v1/bookings?select=slot&day=eq.${date}`,
    { headers: { apikey: SUPABASE.anonKey, Authorization: "Bearer " + SUPABASE.anonKey } });
  if (!r.ok) throw new Error(r.status);
  return new Set((await r.json()).map(x => String(x.slot).slice(0, 5)));
}

// service list in the booking form: in-store prices, or the home price
function renderServiceOptions(){
  const home = document.querySelector('input[name="place"]:checked').value === "home";
  const sel = $("#serviceSelect"), keep = Math.max(sel.selectedIndex, 0);
  sel.innerHTML = SERVICES.map(s => `<option>${esc(s[lang])} (${home ? SHOP.homePrice : s.price} ${SHOP.currency})</option>`).join("");
  sel.selectedIndex = keep;
}

// ---- shop: product cards with colour choice ----
const pick = {};   // chosen colour per product
function renderProducts(){
  const t = T[lang];
  $("#productList").innerHTML = PRODUCTS.map((p, i) => {
    const j0 = pick[i] || 0, c = p.colors ? p.colors[j0] : null, name = esc(p[lang]);
    const img = c ? `<div class="img photo" role="img" aria-label="${name}, ${esc(c[lang])}" style="background-image:var(--daba-${c.key})"></div>` : `<div class="img">photo</div>`;
    const dots = c ? `<div class="swatches" role="group" aria-label="${t.f_color}">${p.colors.map((k, j) =>
      `<button type="button" class="sw" data-p="${i}" data-c="${j}" aria-pressed="${j === j0}" aria-label="${esc(k[lang])}" title="${esc(k[lang])}" style="--c:${k.hex}"></button>`).join("")}<span>${esc(c[lang])}</span></div>` : "";
    const msg = t.m_prod + p[lang] + (c ? ", " + c[lang] : "");
    return `<div class="product${p.colors ? " featured" : ""}">${img}<div class="pbody">
      ${p.isNew ? `<span class="chip new">${t.tag_new}</span>` : ""}<b class="pname">${name}</b>
      ${p.d ? `<p class="desc">${esc(p.d[lang])}</p>` : ""}${dots}
      <span class="price">${p.price} ${SHOP.currency}</span>
      ${c ? `<p class="hint">${t.size_hint}</p>` : ""}
      <a class="btn" target="_blank" rel="noopener" href="${wa(msg)}">${t.reserve}</a></div></div>`;
  }).join("");
}
$("#productList").addEventListener("click", e => {
  const b = e.target.closest(".sw"); if (!b) return;
  pick[b.dataset.p] = +b.dataset.c; renderProducts();
});

render();
</script>
